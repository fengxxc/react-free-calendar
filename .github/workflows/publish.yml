name: Publish to NPM

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: check
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          PREV_VERSION=$(git show HEAD~1:package.json | node -p "const fs=require('fs'); JSON.parse(fs.readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          echo "Previous version: $PREV_VERSION"
          echo "New version: $NEW_VERSION"
          if [ "$NEW_VERSION" != "$PREV_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # 用于 npm OIDC 认证，无需 NPM_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 不要设置 registry-url: 它会写入 //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # 占位符，导致 npm 带着无效 token 请求并跳过 OIDC 交换

      # npm Trusted Publishing(OIDC) 需要 npm >= 11.5.1，Node 22 自带的是 10.x
      - name: Upgrade npm (OIDC requires npm >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm -v

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # pnpm publish 内部会调用系统 npm publish, 由 npm 完成 OIDC 认证
      # trusted publishing 下 provenance 会自动生成, 无需 --provenance, 也无需 NODE_AUTH_TOKEN
      - name: Publish to NPM
        run: pnpm publish --no-git-checks --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: v${{ needs.check-version.outputs.new_version }}
          generate_release_notes: true
